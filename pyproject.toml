[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlp-research"
version = "0.1.0"
description = "Ultra-modern NLP Research Hub with state-of-the-art models and tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["nlp", "natural-language-processing", "machine-learning", "deep-learning", "transformers", "llm"]
authors = [
    { name = "Umit Kacar" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
nlp = [
    # Additional NLP tools
    "spacy>=3.7.0",
    "pandas>=2.0.0",
]
langchain = [
    # LangChain for building LLM applications
    "langchain>=0.1.0",
]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",  # Parallel testing
    "pytest-timeout>=2.2.0",  # Test timeouts
    # Linting & Formatting
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
    # Type stubs
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    # Pre-commit
    "pre-commit>=3.6.0",
    # Security
    "bandit[toml]>=1.7.5",
    "safety>=3.0.0",
    # Development tools
    "ipython>=8.20.0",
    "jupyter>=1.0.0",
    # Build tools
    "build>=1.0.0",
    "twine>=5.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
all = [
    "nlp-research[nlp,langchain,dev,docs]",
]

[project.urls]
Documentation = "https://github.com/umitkacar/NLP_Research#readme"
Issues = "https://github.com/umitkacar/NLP_Research/issues"
Source = "https://github.com/umitkacar/NLP_Research"

# ============================================================================
# Hatch Configuration
# ============================================================================
[tool.hatch.version]
path = "src/nlp_research/__init__.py"

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-timeout",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-parallel = "pytest -n auto {args:tests}"
test-cov = "pytest --cov=src/nlp_research --cov-report=term-missing --cov-report=html --cov-report=xml {args:tests}"
test-cov-parallel = "pytest -n auto --cov=src/nlp_research --cov-report=term-missing --cov-report=html --cov-report=xml {args:tests}"
cov-report = "coverage report --show-missing"
cov-html = "coverage html"
cov-xml = "coverage xml"

[tool.hatch.envs.lint]
detached = true
dependencies = [
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
]

[tool.hatch.envs.lint.scripts]
check = [
    "ruff check .",
    "black --check .",
    "mypy .",
]
format = [
    "black .",
    "ruff check --fix .",
]

[tool.hatch.envs.docs]
dependencies = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build --clean --strict"
serve = "mkdocs serve --dev-addr localhost:8000"

# ============================================================================
# Ruff Configuration
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "D",      # pydocstyle
    "PL",     # Pylint
    "N",      # pep8-naming
    "A",      # flake8-builtins
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "TRY",    # tryceratops
    "FBT",    # flake8-boolean-trap
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "S101",   # Use of assert detected (allow in tests)
    "PLR0913", # Too many arguments to function call
    "FBT001", # Boolean positional arg in function definition
    "FBT002", # Boolean default value in function definition
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ARG", "PLR2004", "D"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["nlp_research"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# Black Configuration
# ============================================================================
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# ============================================================================
# MyPy Configuration
# ============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_equality = true
strict_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "spacy.*",
    "langchain.*",
]
ignore_missing_imports = true

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_gpu: marks tests that require GPU",
    "requires_model: marks tests that require model download",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/setup.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ============================================================================
# Bandit Configuration (Security Linting)
# ============================================================================
[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]

# ============================================================================
# Pyright Configuration (Additional Type Checking)
# ============================================================================
[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
]
pythonVersion = "3.9"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
